name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行测试
        run: pytest -v

      - name: 验证Secret注入
        run: |
          echo "token 长度：${#CAMPUSFIX_TOKEN}"
          if [ ${#CAMPUSFIX_TOKEN} -lt 12 ]; then echo "token 太短"; exit 1; fi
        env:
          CAMPUSFIX_TOKEN: ${{ secrets.CAMPUSFIX_TOKEN }}
